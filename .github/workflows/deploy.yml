# 部署到 GitHub Pages
#
# 这是本站**唯一**的部署通道 —— 不要再手写第二个 deploy 脚本。
# 旧站吃过这个亏：两条通道并存，最后不知道线上跑的是哪个版本。
#
# 需要配合的仓库设置：Settings → Pages → Source 选「GitHub Actions」。

name: Deploy to GitHub Pages

on:
  # 推送到 main 即触发
  push:
    branches: [main]
  # 也可以在 Actions 页手动触发
  workflow_dispatch:

# 允许这个 job 读取仓库并创建 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署。用 false 而不是 true：
# 宁可等前一个跑完，也不要在发布中途取消，避免留下半成品。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          # Astro 7 要求 Node >= 22.12
          node-version: 24
          cache: npm

      - name: 安装依赖
        # 用 npm ci：严格照 package-lock.json 装，锁文件与 package.json 一旦不同步
        # 就直接报错，而不是悄悄装出一套本机才有、CI 上没有的依赖树。
        #
        # ⚠ 2026-11-01 之前这里不是这样。当时锁文件缺 **esbuild** 的平台可选依赖
        #   （npm 对可选依赖安装失败是静默跳过的），于是改用 `npm install` 加一步
        #   「补齐 esbuild 平台二进制」。Astro 7 / Vite 8 换到 **Rolldown** 之后
        #   esbuild 已从依赖树里彻底消失，那一步反而成了必炸的步骤
        #   （`require('esbuild/package.json')` → MODULE_NOT_FOUND）。
        #   现在锁文件里各平台二进制齐全，实测确认过：
        #     @rolldown/binding-linux-x64-gnu · @img/sharp-linux-x64
        #     @tailwindcss/oxide-linux-x64-gnu · lightningcss-linux-x64-gnu
        #   再加二进制就不用补了 —— 补丁消失的前提是**依赖真的变了**，别只删代码。
        #
        # 仍然跳过安装脚本：本站所有原生二进制都通过 optionalDependencies 分发
        # （sharp / rolldown / tailwind oxide / satteri），不靠 postinstall 下载。
        run: npm ci --ignore-scripts

      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
